<app-header></app-header>

<div class="contact-wrapper">
  <div class="contact-container">
    <h2>Contacto</h2>
    <p>Completa el formulario a continuación y nos pondremos en contacto contigo lo antes posible.</p>

    <form class="contact-form" id="contactForm">
      <!-- Nombre -->
      <div class="form-group">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required />
      </div>

      <!-- Correo -->
      <div class="form-group">
        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" name="email" placeholder="tu@email.com" required />
      </div>

      <!-- Mensaje -->
      <div class="form-group">
        <label for="mensaje">Mensaje:</label>
        <textarea id="mensaje" name="mensaje" placeholder="Escribe tu mensaje" rows="5" required></textarea>
      </div>

      <button type="submit" class="submit-btn">Enviar</button>
    </form>
  </div>

  <!-- Decoraciones laterales animadas -->
  <div class="decorative-left"></div>
  <div class="decorative-right"></div>
</div>

<app-footer></app-footer>
