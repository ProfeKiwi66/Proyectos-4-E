<header>
  <a class="logo" routerLink="/">
    <img class="img-chrono" src="https://i.ibb.co/RTfZxSY6/unnamed.png" alt="LogoChronoplan">
    <i class="fa-regular fa-clock"></i>
    <span>ChronoPlan</span>
  </a>

  <!-- SECCIÓN CENTRAL - Aquí va el menú de usuario -->
  <div class="header-center">
    <!-- MOSTRAR ESTO SI ESTÁ LOGUEADO -->
    <div *ngIf="estaLogueado()" class="user-section-centered">
      <div class="user-welcome-centered">
        <span class="welcome-text-centered">¡Bienvenido!</span>
        <span class="user-name-centered">{{ getNombreCorto() }}</span>
      </div>
    </div>
  </div>

  <div class="buttons-right">
    <a class="btn-primary spaced-btn" routerLink="/inicio">Inicio</a>
    <a class="btn-primary spaced-btn" routerLink="/contacto">Contáctanos</a>

    <!-- MOSTRAR ESTOS BOTONES SI NO ESTÁ LOGUEADO -->
    <div *ngIf="!estaLogueado()" class="auth-buttons">
      <a class="btn-primary spaced-btn" routerLink="/iniciosesion">Iniciar Sesión</a>
      <a class="btn-primary spaced-btn" routerLink="/registro">Registrarse</a>
    </div>

    <!-- MOSTRAR BOTÓN CERRAR SESIÓN SI ESTÁ LOGUEADO -->
    <div *ngIf="estaLogueado()" class="logout-section">
      <button class="btn-logout-centered" (click)="cerrarSesion()">
        <i class="fa-solid fa-right-from-bracket"></i>
        Cerrar Sesión
      </button>
    </div>
  </div>

  <div class="morphing-bg"></div>
</header>
