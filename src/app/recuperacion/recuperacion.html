
<div class="contact-wrapper">
  <div class="contact-container">
    <h2>Recuperar Contraseña</h2>
    <p>Completa el formulario a continuación para recuperar tu contraseña.</p>

    <form class="contact-form" id="contactForm">
        <!-- Nombre -->
        <div class="form-group">
          <label for="nombre">Nombre:</label>
          <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required />
        </div>
  
        <!-- Correo -->
        <div class="form-group">
          <label for="email">Correo electrónico:</label>
          <input type="gmail" id="gmail" name="gmail" placeholder="tu@gmail.com" required />
        </div>



      <div class="button-group">
        <button type="submit" class="submit-btn">Recuperar Contraseña</button>

      </div>

      
    </form>
  </div>

  <!-- Decoraciones laterales animadas -->
  <div class="decorative-left"></div>
  <div class="decorative-right"></div>
</div>
